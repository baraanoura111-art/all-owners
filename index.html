<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Owners</title>
<meta name="theme-color" content="#0D0C0B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="All Owners">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0D0C0B; --surface:#171512; --ink:#F4EEE4; --muted:#B8AE9F; --sage:#AFC2AB; --sage-btn:#C3CFBE; --line:#2A2621; --box:#3F4B43; --body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:300; font-size:14px; line-height:1.5; -webkit-text-size-adjust:100%; }
  button, input, select { font:inherit; color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .top { display:flex; align-items:center; gap:12px; padding:6px 0 16px; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--sage); }
  .brand svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; }
  .brand b { font-weight:400; font-size:12px; letter-spacing:.32em; text-transform:uppercase; }
  .who { margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .who a { color:var(--sage); cursor:pointer; text-decoration:none; margin-left:6px; }
  .f { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .f select, .f input, .s input { width:100%; height:46px; padding:0 12px; border-radius:12px; border:1px solid var(--box); background:var(--surface); font-size:14px; min-width:0; }
  .f select { appearance:none; -webkit-appearance:none; padding-right:30px; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px; background-size:5px 5px; background-repeat:no-repeat; text-overflow:ellipsis; }
  .f input:disabled { opacity:.45; }
  .f #unit { grid-column:1 / -1; }
  input:focus, select:focus { outline:none; border-color:var(--sage); }
  .s { display:flex; gap:8px; margin-top:8px; }
  .btn { height:46px; padding:0 18px; border-radius:12px; border:1px solid var(--box); background:transparent; cursor:pointer; flex:none; font-size:12.5px; letter-spacing:.04em; }
  .btn:hover { border-color:var(--sage); color:var(--sage); }
  .btn.solid { background:var(--sage-btn); border-color:var(--sage-btn); color:#161514; font-weight:400; letter-spacing:.2em; text-transform:uppercase; font-size:11.5px; }
  .h { font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--sage); margin:18px 0 6px; }
  .r { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .u { flex:none; min-width:56px; max-width:96px; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m { flex:1; min-width:0; } .m b { display:block; font-weight:400; font-size:14px; overflow-wrap:anywhere; }
  .m span { display:block; font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .a { flex:none; display:flex; gap:6px; }
  .a a, .a button { height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--box); background:transparent; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink); cursor:pointer; }
  .a a:hover, .a button:hover { border-color:var(--sage); color:var(--sage); }
  .a .wa { background:var(--sage-btn); border-color:var(--sage-btn); color:#161514; }
  .a .wa:hover { background:var(--sage); color:#161514; }
  .h { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; }
  .h em { font-style:normal; color:var(--muted); letter-spacing:.16em; }
  .a button:disabled { opacity:.55; cursor:default; }
  .none { font-size:12px; color:var(--muted); align-self:center; }
  .note { color:var(--muted); font-size:13px; padding:18px 0; }
  .note b { display:block; color:var(--ink); font-weight:400; }
  .opt { display:none; align-items:center; gap:8px; margin-top:22px; font-size:12.5px; color:var(--muted); }
  .opt input { accent-color:var(--sage); }
  body.lap .opt { display:flex; }
  @media (min-width:900px) { .f { grid-template-columns:1fr 1.4fr 200px; } .f #unit { grid-column:auto; } }
  @media (max-width:520px) { .r { flex-wrap:wrap; } .a { width:100%; padding-left:68px; } .a a, .a button { flex:1; } .who span { display:none; } }
  @media (max-width:820px) { .f select, .f input, .s input, .lg input { font-size:16px; } }   /* stops iPhone zooming in on tap */
  @media (max-width:380px) { .a { padding-left:0; } .a a, .a button { padding:0 6px; min-width:0; letter-spacing:.1em; } }
  /* login */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .lg { width:100%; max-width:320px; text-align:center; }
  .lg .brand { justify-content:center; margin-bottom:26px; flex-direction:column; gap:12px; }
  .lg .brand svg { width:40px; height:40px; }
  .lg input { width:100%; height:50px; text-align:center; letter-spacing:.5em; font-size:20px; border-radius:12px; border:1px solid var(--box); background:var(--surface); margin-bottom:10px; }
  .lg .btn { width:100%; }
  .err { color:#E3A39A; font-size:13px; min-height:20px; margin-top:10px; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); opacity:0; transition:.2s; background:var(--sage-btn); color:#161514; padding:9px 16px; border-radius:12px; font-size:13px; pointer-events:none; max-width:90vw; }
  #toast.on { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="ic" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.3 3.1-5.2 6-5.2s5.4 1.9 6 5.2"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.6c1.8.6 3 2.3 3.4 4.9"/></symbol></svg>

<div id="login" style="display:none">
  <form class="lg" onsubmit="doLogin();return false">
    <div class="brand"><svg><use href="#ic"/></svg><b>All Owners</b></div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <button class="btn solid" id="loginBtn" type="submit">Log in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="top">
    <div class="brand"><svg><use href="#ic"/></svg><b>All Owners</b></div>
    <div class="who"><span id="who"></span><a onclick="logout()">Log out</a></div>
  </div>
  <div class="f">
    <select id="area" aria-label="Area" onchange="S.area=this.value;S.cl='';S.unit='';$('unit').value='';save();draw();clearOut()"></select>
    <select id="cl" aria-label="Building or cluster" onchange="S.cl=this.value;S.unit='';$('unit').value='';save();$('unit').disabled=!S.cl;fetchOwners()"></select>
    <input id="unit" aria-label="Unit number" placeholder="Unit number" autocomplete="off" oninput="S.unit=this.value;clearTimeout(T);T=setTimeout(fetchOwners,350)">
  </div>
  <form class="s" onsubmit="search();return false"><input id="q" placeholder="Or search every area by owner name, phone or email" autocomplete="off" enterkeyhint="search"><button class="btn" type="submit">Search</button></form>
  <div id="out"></div>
  <label class="opt"><input type="checkbox" id="desk" onchange="saveDesk()"> Open WhatsApp in the desktop app</label>
</div>
<div id="toast"></div>

<script src="config.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
